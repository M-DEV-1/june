[package]
name = "ora"
version = "0.1.0"
description = "Ora desktop surface (mock)"
authors = ["mdev"]
edition = "2021"

[lib]
name = "ora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri's own build script sets cfg(dev) whenever custom-protocol is off (dev = !has_feature("custom-protocol") in tauri's build.rs), and generate_context! in a cfg(dev) build points the windows at build.devUrl -- the Vite dev server on http://localhost:1420 -- instead of the frontend baked in from frontendDist. A window loaded from that origin is not one the daemon's CORS allowlist names (windowOrigins in cmd/ipc.go), so every request it makes is discarded by the webview and the window shows the daemon as unreachable while the daemon is fine.
# Nothing here drives the Tauri CLI -- scripts/release.sh builds the window with a plain `cargo build --release` -- so the feature is on by default and any build of this crate produces the packaged window. To work on the frontend against the Vite dev server instead, build with --no-default-features and start the daemon with ORA_DEV_ORIGIN=http://localhost:1420.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

# Same gtk/gdkx11 major.minor Tauri itself depends on for this target, so Cargo unifies to one copy instead of linking two GTK bindings.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
# The same X11 bindings gdkx11 already pulls in, asked for by name so that libX11 is linked: Ora sends the window manager two EWMH messages of its own, and gdk offers no way to send them. See send_wm_message in src/lib.rs.
x11 = { version = "2", features = ["xlib"] }
